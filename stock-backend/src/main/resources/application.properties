spring.application.name=stock-backend

server.port=${PORT:8080}

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/stockdb}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:admin}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:admin}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate & JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Redis / Valkey Configuration (Render Environment Variables)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.url=${REDIS_URL:redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}}

# Cache & Redis Logging (Hit/Miss & Connection Visibility)
logging.level.org.springframework.cache=DEBUG
logging.level.org.springframework.data.redis=DEBUG

# JWT Security
app.jwt.secret=${JWT_SECRET:stock-portfolio-manager-jwt-secret-key}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# External Market Data (Finnhub & Twelve Data)
stock.api.finnhub.base-url=https://finnhub.io/api/v1
stock.api.finnhub.api-key=${FINNHUB_API_KEY:YOUR_FINNHUB_API_KEY_HERE}
stock.api.twelvedata.base-url=https://api.twelvedata.com
stock.api.twelvedata.api-key=${TWELVE_DATA_API_KEY:YOUR_TWELVE_DATA_API_KEY_HERE}
stock.api.connect-timeout-seconds=5
stock.api.read-timeout-seconds=10
stock.api.gemini.read-timeout-seconds=60
stock.price.update.initial-delay-ms=600000
stock.price.update.fixed-delay-ms=3000000

# Google Gemini 1.5 Flash (LangChain4j)
stock.api.gemini.base-url=https://generativelanguage.googleapis.com
stock.api.gemini.api-key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
gemini.model.name=gemini-1.5-flash